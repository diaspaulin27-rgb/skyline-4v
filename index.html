<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainy Skyline - Zanon Games</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05070a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #bgCanvas {
      z-index: 1;
    }
    #glassCanvas {
      z-index: 2;
      cursor: pointer;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .ui-element {
      pointer-events: auto;
      background: rgba(15, 20, 30, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: #e2e8f0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .phase-badge {
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    footer {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    button:active {
      transform: translateY(0);
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    input[type=range] {
      accent-color: #38bdf8;
      cursor: pointer;
    }
    #hint {
      position: absolute;
      bottom: 85px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.6);
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      pointer-events: none;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="glassCanvas"></canvas>

    <div id="hint">ð¡ Arraste o mouse/dedo para limpar o vidro embaÃ§ado</div>

    <div id="ui-overlay">
      <header class="ui-element">
        <div>
          <h1>Rainy Skyline</h1>
          <span style="font-size: 0.75rem; color: #94a3b8;">Zanon Games</span>
        </div>
        <div class="phase-badge" id="phase-title">Fase 01 / 20</div>
      </header>

      <footer class="ui-element">
        <button id="btn-prev">â Anterior</button>
        <button id="btn-audio">ð Ãudio: ON</button>
        <button id="btn-wipe">ð§¹ Limpar Vidro</button>
        <button id="btn-next">PrÃ³xima âº</button>

        <div class="control-group">
          <label for="rain-slider">Chuva:</label>
          <input type="range" id="rain-slider" min="10" max="200" value="80">
        </div>
      </footer>
    </div>
  </div>

  <script>
    // --- ESTADO GLOBAL ---
    const state = {
      currentPhase: 0,
      audioEnabled: true,
      rainIntensity: 80,
      isMouseDown: false,
      lastMousePos: { x: 0, y: 0 }
    };

    // DefiniÃ§Ã£o das 20 fases com paleta e configuraÃ§Ãµes de chuva
    const phases = Array.from({ length: 20 }, (_, i) => {
      const pad = String(i + 1).padStart(2, '0');
      return {
        id: i,
        name: `Fase ${pad}`,
        sky: [
          `hsl(${(i * 18 + 200) % 360}, 40%, ${10 + (i % 5) * 2}%)`,
          `hsl(${(i * 18 + 220) % 360}, 50%, ${3 + (i % 3) * 2}%)`
        ],
        type: i % 2 === 0 ? 'city' : 'car'
      };
    });

    // --- CANVAS & CONTEXTO ---
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    const glassCanvas = document.getElementById('glassCanvas');
    const glassCtx = glassCanvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      bgCanvas.width = W;
      bgCanvas.height = H;
      glassCanvas.width = W;
      glassCanvas.height = H;
      initFog();
      drawCityBackground();
    }

    // --- CARREGAMENTO PADRONIZADO DE IMAGENS (fase01.jpg atÃ© fase20.jpg) ---
    const phaseImages = [];
    for (let i = 0; i < 20; i++) {
      let img = new Image();
      let num = String(i + 1).padStart(2, '0'); // Garante formato "01", "02"... "20"
      img.src = `fase${num}.jpg`;
      img.onload = () => {
        if (state.currentPhase === i) drawCityBackground();
      };
      phaseImages[i] = img;
    }

    let animT = 0;
    function drawAnimatedDetails(fase, ctx, W, H) {
      animT += 0.02;
      if ([1, 2, 8].includes(fase)) {
        let pisca = 0.4 + Math.sin(animT * 2) * 0.6;
        ctx.fillStyle = `rgba(255,200,80,${pisca})`;
        ctx.beginPath();
        ctx.arc(W * 0.15, H * 0.25, 6, 0, Math.PI * 2);
        ctx.fill();
      }
      if (fase === 0 || fase === 7) {
        ctx.save();
        ctx.translate(W * 0.85, H * 0.15);
        ctx.rotate(Math.sin(animT) * 0.03);
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(-80, 0, 160, 20);
        ctx.restore();
      }
    }

    function drawCityBackground() {
      const phase = phases[state.currentPhase];
      bgCtx.clearRect(0, 0, W, H);

      // Desenha a imagem se ela jÃ¡ estiver carregada e sem erros
      if (phaseImages[state.currentPhase] && phaseImages[state.currentPhase].complete && phaseImages[state.currentPhase].naturalWidth !== 0) {
        bgCtx.drawImage(phaseImages[state.currentPhase], 0, 0, W, H);
      } else {
        // Fundo padrÃ£o caso a imagem ainda nÃ£o tenha carregado
        const sky = bgCtx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, phase.sky[0]);
        sky.addColorStop(0.55, phase.sky[1]);
        sky.addColorStop(1, "#020308");
        bgCtx.fillStyle = sky;
        bgCtx.fillRect(0, 0, W, H);

        // PrÃ©dios/Luzes procedurais de fundo caso nÃ£o haja imagem
        bgCtx.fillStyle = "rgba(10, 15, 25, 0.85)";
        for (let x = 0; x < W; x += 40) {
          let bh = (Math.sin(x * 0.05 + state.currentPhase) * 0.3 + 0.5) * H * 0.5;
          bgCtx.fillRect(x, H - bh, 35, bh);
        }
      }

      drawAnimatedDetails(state.currentPhase, bgCtx, W, H);
    }

    // --- EFEITO DE VIDRO EMBAÃADO & GOTAS DE CHUVA ---
    let fogCanvas = document.createElement('canvas');
    let fogCtx = fogCanvas.getContext('2d');

    function initFog() {
      fogCanvas.width = W;
      fogCanvas.height = H;
      fogCtx.fillStyle = "rgba(180, 200, 220, 0.35)";
      fogCtx.fillRect(0, 0, W, H);
    }

    function wipeGlass(x, y, radius = 40) {
      fogCtx.save();
      fogCtx.globalCompositeOperation = 'destination-out';
      let grad = fogCtx.createRadialGradient(x, y, 0, x, y, radius);
      grad.addColorStop(0, 'rgba(0,0,0,1)');
      grad.addColorStop(0.7, 'rgba(0,0,0,0.8)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      fogCtx.fillStyle = grad;
      fogCtx.beginPath();
      fogCtx.arc(x, y, radius, 0, Math.PI * 2);
      fogCtx.fill();
      fogCtx.restore();
    }

    // Sistema de Gotas
    class Drop {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * -H;
        this.r = Math.random() * 2.5 + 1.5;
        this.vy = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random() * 0.6 + 0.3;
      }
      update() {
        this.y += this.vy;
        this.x += this.vx;
        if (this.y > H) this.reset();
      }
      draw(ctx) {
        ctx.save();
        ctx.fillStyle = `rgba(220, 240, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        
        // Brilho/Reflexo
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        ctx.beginPath();
        ctx.arc(this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let drops = Array.from({ length: 120 }, () => new Drop());

    function updateRain() {
      const targetCount = state.rainIntensity;
      while (drops.length < targetCount) drops.push(new Drop());
      while (drops.length > targetCount) drops.pop();

      drops.forEach(d => d.update());
    }

    function renderGlass() {
      glassCtx.clearRect(0, 0, W, H);
      
      // Desenha o embaÃ§ado
      glassCtx.drawImage(fogCanvas, 0, 0);

      // Desenha as gotas de chuva por cima
      drops.forEach(d => d.draw(glassCtx));
    }

    // --- MOTOR DE ÃUDIO WEB AUDIO API (SOM DE CHUVA) ---
    let audioCtx = null;
    let rainNoiseNode = null;
    let gainNode = null;

    function initAudio() {
      if (audioCtx) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();

        // Gerador de ruÃ­do rosa/marrom para simular som de chuva
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          output[i] *= 0.11;
          b6 = white * 0.115926;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        // Filtro passa-baixa para suavizar o som
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = state.audioEnabled ? 0.15 : 0;

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        whiteNoise.start();
      } catch (e) {
        console.log("Ãudio nÃ£o suportado ou bloqueado pelo navegador.");
      }
    }

    function toggleAudio() {
      state.audioEnabled = !state.audioEnabled;
      const btn = document.getElementById('btn-audio');
      btn.innerText = state.audioEnabled ? "ð Ãudio: ON" : "ð Ãudio: OFF";
      
      if (!audioCtx) {
        initAudio();
      } else if (gainNode) {
        gainNode.gain.setTargetAtTime(state.audioEnabled ? 0.15 : 0, audioCtx.currentTime, 0.1);
      }
    }

    // --- CONTROLES DE INTERAÃÃO (MOUSE & TOUCH) ---
    function handlePointerStart(x, y) {
      state.isMouseDown = true;
      state.lastMousePos = { x, y };
      wipeGlass(x, y, 35);
      if (!audioCtx && state.audioEnabled) initAudio();
    }

    function handlePointerMove(x, y) {
      if (!state.isMouseDown) return;
      
      // InterpolaÃ§Ã£o para linha contÃ­nua de limpeza
      let dx = x - state.lastMousePos.x;
      let dy = y - state.lastMousePos.y;
      let dist = Math.hypot(dx, dy);
      let steps = Math.max(1, Math.floor(dist / 10));

      for (let i = 0; i < steps; i++) {
        let ix = state.lastMousePos.x + (dx * i) / steps;
        let iy = state.lastMousePos.y + (dy * i) / steps;
        wipeGlass(ix, iy, 35);
      }
      state.lastMousePos = { x, y };
    }

    function handlePointerEnd() {
      state.isMouseDown = false;
    }

    glassCanvas.addEventListener('mousedown', e => handlePointerStart(e.clientX, e.clientY));
    glassCanvas.addEventListener('mousemove', e => handlePointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', handlePointerEnd);

    glassCanvas.addEventListener('touchstart', e => {
      if (e.touches.length > 0) handlePointerStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    glassCanvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchend', handlePointerEnd);

    // --- NAVEGAÃÃO DE FASES E UI ---
    function updateUI() {
      document.getElementById('phase-title').innerText = `Fase ${String(state.currentPhase + 1).padStart(2, '0')} / 20`;
      drawCityBackground();
      initFog();
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      state.currentPhase = (state.currentPhase - 1 + 20) % 20;
      updateUI();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      state.currentPhase = (state.currentPhase + 1) % 20;
      updateUI();
    });

    document.getElementById('btn-wipe').addEventListener('click', () => {
      initFog();
    });

    document.getElementById('btn-audio').addEventListener('click', toggleAudio);

    document.getElementById('rain-slider').addEventListener('input', e => {
      state.rainIntensity = parseInt(e.target.value, 10);
    });

    // --- LOOP PRINCIPAL DE ANIMAÃÃO ---
    function loop() {
      updateRain();
      renderGlass();
      requestAnimationFrame(loop);
    }

    // --- INICIALIZAÃÃO ---
    window.addEventListener('resize', resize);
    resize();
    loop();

  </script>
</body>
</html>

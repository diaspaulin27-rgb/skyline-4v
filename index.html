<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>Rainy Skyline — Ultimate Atmospheric Experience</title>

<style>
:root {
  --primary: #38bdf8;
  --primary-glow: rgba(56, 189, 248, 0.5);
  --bg-dark: #020617;
  --panel-bg: rgba(15, 23, 42, 0.85);
  --panel-border: rgba(255, 255, 255, 0.1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: #f8fafc; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; touch-action: none; }

canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#bgCanvas { z-index: 1; }
#cloudCanvas { z-index: 2; opacity: 0.4; }
#rainCanvas { z-index: 3; }
#glassCanvas { z-index: 4; }
#fogCanvas { z-index: 5; }

/* Overlay Effects */
#vignette { position: absolute; inset: 0; z-index: 10; pointer-events: none; background: radial-gradient(circle at center, transparent 20%, rgba(2, 6, 23, 0.8) 100%); }
#lightningFlash { position: absolute; inset: 0; z-index: 11; background: white; opacity: 0; pointer-events: none; mix-blend-mode: overlay; transition: opacity 0.05s; }

/* UI Elements */
#hud { position: absolute; inset: 0; z-index: 20; pointer-events: none; padding: env(safe-area-inset-top) 20px 20px 20px; display: flex; flex-direction: column; justify-content: space-between; transition: opacity 0.5s; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 20px; }
.hud-btn { width: 50px; height: 50px; border-radius: 15px; border: 1px solid var(--panel-border); background: var(--panel-bg); backdrop-filter: blur(10px); color: white; display: grid; place-items: center; cursor: pointer; pointer-events: auto; transition: 0.2s; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
.hud-btn:active { transform: scale(0.9); }

.status-badge { background: var(--panel-bg); border: 1px solid var(--panel-border); backdrop-filter: blur(10px); padding: 8px 16px; border-radius: 20px; color: var(--primary); font-weight: 700; font-size: 14px; pointer-events: auto; display: flex; align-items: center; gap: 8px; }

#instruction { text-align: center; color: white; opacity: 0.6; font-size: 10px; letter-spacing: 5px; text-transform: uppercase; animation: pulse 3s infinite; margin-bottom: 10px; }
@keyframes pulse { 0%, 100% { opacity: 0.2; transform: translateY(0); } 50% { opacity: 0.7; transform: translateY(-5px); } }

.progress-container { width: 100%; max-width: 400px; margin: 0 auto; pointer-events: auto; }
.progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; position: relative; }
#progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #0ea5e9, #38bdf8, #f0f9ff); box-shadow: 0 0 15px var(--primary); transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1); }

/* Screens */
.screen { position: absolute; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(15px); transition: 0.4s; }
.screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; transform: scale(1.05); }

.card { width: 90%; max-width: 440px; background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 32px; padding: 40px 30px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
h1 { font-size: 32px; margin: 0; background: linear-gradient(to bottom, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
.subtitle { font-size: 10px; text-transform: uppercase; letter-spacing: 4px; color: var(--primary); margin-bottom: 30px; opacity: 0.8; }

.btn-group { display: flex; flex-direction: column; gap: 12px; }
.btn { padding: 16px; border-radius: 18px; border: 1px solid var(--panel-border); background: rgba(255,255,255,0.05); color: white; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
.btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
.btn-primary { background: var(--primary); color: #020617; border: none; box-shadow: 0 10px 20px var(--primary-glow); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 25px var(--primary-glow); }

/* Phase List */
.phase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; max-height: 200px; overflow-y: auto; padding-right: 5px; }
.phase-item { padding: 15px; border-radius: 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); text-align: left; cursor: pointer; }
.phase-item.active { border-color: var(--primary); background: rgba(56, 189, 248, 0.1); }
.phase-item.locked { opacity: 0.3; cursor: not-allowed; }

#toast { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; font-size: 12px; opacity: 0; transition: 0.3s; z-index: 1000; pointer-events: none; border: 1px solid var(--primary); }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(-10px); }

input[type=range] { width: 100%; margin: 15px 0; accent-color: var(--primary); }
.setting-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 14px; color: #cbd5e1; }
</style>
</head>
<body>

<div id="game">
  <canvas id="bgCanvas"></canvas>
  <canvas id="cloudCanvas"></canvas>
  <canvas id="rainCanvas"></canvas>
  <canvas id="glassCanvas"></canvas>
  <canvas id="fogCanvas"></canvas>
  
  <div id="vignette"></div>
  <div id="lightningFlash"></div>
  <div id="toast">Message</div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="pauseBtn" class="hud-btn">Ⅱ</button>
      <div class="status-badge">🌧️ <span id="pointsDisplay">0</span></div>
    </div>
    <div class="hud-bottom">
      <div id="instruction">Swipe to reveal the city</div>
      <div class="progress-container">
        <div class="progress-bar"><div id="progressFill"></div></div>
      </div>
    </div>
  </div>

  <!-- Menu Principal -->
  <section id="mainMenu" class="screen">
    <div class="card">
      <h1>Rainy Skyline</h1>
      <p class="subtitle">Ultimate Experience</p>
      <div class="btn-group">
        <button id="startBtn" class="btn btn-primary">CONTINUE JOURNEY</button>
        <button id="zenBtn" class="btn">INFINITE ZEN MODE</button>
        <button id="phasesBtn" class="btn">SELECT MEMORY</button>
        <button id="settingsBtn" class="btn">ATMOSPHERE SETTINGS</button>
      </div>
    </div>
  </section>

  <!-- Seleção de Fases -->
  <section id="phasesScreen" class="screen hidden">
    <div class="card">
      <h2 style="margin-top:0">Memories</h2>
      <div id="phaseList" class="phase-grid"></div>
      <button id="backFromPhases" class="btn" style="width:100%">BACK</button>
    </div>
  </section>

  <!-- Configurações -->
  <section id="settingsScreen" class="screen hidden">
    <div class="card">
      <h2 style="margin-top:0">Atmosphere</h2>
      <div class="setting-item"><span>Rain Intensity</span><span id="rainVal">70%</span></div>
      <input type="range" id="rainSlider" min="0" max="100" value="70">
      
      <div class="setting-item"><span>Music Volume</span><span id="musicVal">50%</span></div>
      <input type="range" id="musicSlider" min="0" max="100" value="50">
      
      <div class="btn-group" style="margin-top:20px">
        <button id="toggleVibration" class="btn">VIBRATION: ON</button>
        <button id="saveSettings" class="btn btn-primary">SAVE</button>
      </div>
    </div>
  </section>

  <!-- Pausa -->
  <section id="pauseScreen" class="screen hidden">
    <div class="card">
      <h2>Paused</h2>
      <div class="btn-group">
        <button id="resumeBtn" class="btn btn-primary">RESUME</button>
        <button id="mainMenuBtn" class="btn">QUIT TO MENU</button>
      </div>
    </div>
  </section>
</div>

<script>
/**
 * RAINY SKYLINE - ULTIMATE CORE
 */

const state = {
  started: false,
  paused: false,
  isZen: false,
  currentPhase: 0,
  highestPhase: 0,
  points: 0,
  rainIntensity: 0.7,
  musicVolume: 0.5,
  vibration: true,
  fogProgress: 0,
  dpr: Math.min(window.devicePixelRatio, 2),
  activePointers: new Map(),
  lastTime: performance.now(),
  carOffset: 0
};

const phases = [
  { name: "First Rain", hue: 210, sky: ["#020617", "#0f172a"], lights: ["#38bdf8", "#7dd3fc", "#e0f2fe"], rain: 0.6, type: "rain" },
  { name: "Neon District", hue: 280, sky: ["#0f051a", "#2e1065"], lights: ["#f472b6", "#c084fc", "#22d3ee"], rain: 0.8, type: "rain" },
  { name: "Midnight Drive", hue: 200, sky: ["#020617", "#000000"], lights: ["#f87171", "#fbbf24", "#ffffff"], rain: 0.5, type: "car" },
  { name: "Winter Silence", hue: 190, sky: ["#1e293b", "#334155"], lights: ["#f1f5f9", "#cbd5e1"], rain: 0.4, type: "snow" },
  { name: "Summer Storm", hue: 220, sky: ["#081421", "#1e3a8a"], lights: ["#fbbf24", "#60a5fa"], rain: 1.0, type: "rain", thunder: true },
  { name: "Industrial Fog", hue: 160, sky: ["#134e4a", "#0f172a"], lights: ["#2dd4bf", "#fbbf24"], rain: 0.3, type: "rain" },
  { name: "Golden Hour", hue: 30, sky: ["#451a03", "#78350f"], lights: ["#fcd34d", "#fb923c"], rain: 0.5, type: "rain" }
];

// Canvas Setup
const canvases = ['bg', 'cloud', 'rain', 'glass', 'fog'];
const ctxs = {};
canvases.forEach(id => {
  const c = document.getElementById(id + 'Canvas');
  ctxs[id] = c.getContext('2d');
});

let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvases.forEach(id => {
    const c = document.getElementById(id + 'Canvas');
    c.width = W * state.dpr;
    c.height = H * state.dpr;
    ctxs[id].scale(state.dpr, state.dpr);
  });
  if (state.started) {
    initFog();
    drawStaticBackground();
  }
}
window.addEventListener('resize', resize);
resize();

/**
 * AUDIO ENGINE - Procedural Piano & Rain
 */
let audioCtx, masterGain, pianoGain;
const pentatonic = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63, 293.66, 329.63, 392.00, 440.00];

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.connect(audioCtx.destination);
  
  // Ambient Drone
  const drone = audioCtx.createOscillator();
  const dGain = audioCtx.createGain();
  drone.type = 'sine';
  drone.frequency.value = 65.41; // C2
  dGain.gain.value = 0.05;
  drone.connect(dGain);
  dGain.connect(masterGain);
  drone.start();

  pianoGain = audioCtx.createGain();
  pianoGain.connect(masterGain);
  
  schedulePiano();
  updateAudioVolumes();
}

function updateAudioVolumes() {
  if (!masterGain) return;
  masterGain.gain.setTargetAtTime(state.musicVolume, audioCtx.currentTime, 0.1);
}

function playPianoNote() {
  if (!state.started || state.paused || state.musicVolume < 0.1) return;
  const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.1);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4);
  
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 800;

  osc.connect(filter);
  filter.connect(g);
  g.connect(pianoGain);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 4);
}

function schedulePiano() {
  const next = 3000 + Math.random() * 5000;
  setTimeout(() => {
    playPianoNote();
    schedulePiano();
  }, next);
}

/**
 * VISUAL ENGINE
 */
let buildings = [];
let clouds = [];

function drawStaticBackground() {
  const p = phases[state.currentPhase];
  const g = ctxs.bg.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, p.sky[0]);
  g.addColorStop(1, p.sky[1]);
  ctxs.bg.fillStyle = g;
  ctxs.bg.fillRect(0, 0, W, H);

  buildings = [];
  let x = -50;
  while (x < W) {
    const w = 60 + Math.random() * 100;
    const h = 150 + Math.random() * (H * 0.6);
    buildings.push({ x, w, h, color: `rgba(2, 6, 23, 0.95)`, lights: [] });
    
    // Generate windows
    const b = buildings[buildings.length - 1];
    for (let wy = H - h + 20; wy < H - 20; wy += 25) {
      for (let wx = x + 10; wx < x + w - 10; wx += 20) {
        if (Math.random() > 0.7) {
          b.lights.push({ x: wx, y: wy, color: p.lights[Math.floor(Math.random() * p.lights.length)] });
        }
      }
    }
    x += w + 5;
  }
}

function updateClouds() {
  ctxs.cloud.clearRect(0, 0, W, H);
  ctxs.cloud.fillStyle = 'rgba(255,255,255,0.05)';
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 100) c.x = -100;
    ctxs.cloud.beginPath();
    ctxs.cloud.arc(c.x, c.y, c.r, 0, Math.PI * 2);
    ctxs.cloud.fill();
  });
}

// Clouds init
for(let i=0; i<15; i++) clouds.push({ x: Math.random()*W, y: Math.random()*H*0.5, r: 50+Math.random()*100, speed: 0.1 + Math.random()*0.2 });

class Drop {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = -20;
    this.r = 1 + Math.random() * 3;
    this.vy = 2 + Math.random() * 5;
    this.life = 1;
  }
  update() {
    this.y += this.vy;
    if (this.y > H) this.reset();
  }
  draw(ctx) {
    ctx.fillStyle = `rgba(255,255,255,0.3)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

const rain = Array.from({ length: 150 }, () => new Drop());

function initFog() {
  const ctx = ctxs.fog;
  ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W);
  g.addColorStop(0, 'rgba(200, 215, 225, 0.85)');
  g.addColorStop(1, 'rgba(150, 165, 175, 0.9)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  state.fogProgress = 0;
  updateProgress();
}

function clearFog(x, y) {
  const ctx = ctxs.fog;
  ctx.globalCompositeOperation = 'destination-out';
  const g = ctx.createRadialGradient(x, y, 0, x, y, 45);
  g.addColorStop(0, 'rgba(0,0,0,1)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, 45, 0, Math.PI * 2);
  ctx.fill();
  
  // Sparkle effect
  if (Math.random() > 0.9) {
    showToast("Clear vision...", 1000);
  }
}

/**
 * GAME LOOP
 */
function loop(time) {
  const dt = time - state.lastTime;
  state.lastTime = time;

  if (state.started && !state.paused) {
    // Draw Background with Bloom
    ctxs.bg.clearRect(0, 0, W, H);
    drawStaticBackground(); // Redraw static part
    
    buildings.forEach(b => {
      ctxs.bg.fillStyle = b.color;
      ctxs.bg.fillRect(b.x, H - b.h, b.w, b.h);
      
      b.lights.forEach(l => {
        // Subtle flicker
        const op = 0.3 + Math.random() * 0.7;
        ctxs.bg.shadowBlur = 10;
        ctxs.bg.shadowColor = l.color;
        ctxs.bg.fillStyle = l.color;
        ctxs.bg.globalAlpha = op;
        ctxs.bg.fillRect(l.x, l.y, 4, 3);
        ctxs.bg.globalAlpha = 1;
        ctxs.bg.shadowBlur = 0;
      });
    });

    updateClouds();

    // Rain
    ctxs.rain.clearRect(0, 0, W, H);
    rain.forEach(d => {
      d.update();
      d.draw(ctxs.rain);
    });

    if (state.isZen) {
      // Slow condensation
      ctxs.fog.globalCompositeOperation = 'source-over';
      ctxs.fog.fillStyle = 'rgba(180, 195, 205, 0.005)';
      ctxs.fog.fillRect(0, 0, W, H);
    }
  }

  requestAnimationFrame(loop);
}

/**
 * INTERACTION & UI
 */
const fogCanvas = document.getElementById('fogCanvas');
fogCanvas.addEventListener('pointerdown', e => {
  initAudio();
  state.activePointers.set(e.pointerId, true);
  clearFog(e.clientX, e.clientY);
});

fogCanvas.addEventListener('pointermove', e => {
  if (state.activePointers.has(e.pointerId)) {
    clearFog(e.clientX, e.clientY);
    calculateProgress();
  }
});

fogCanvas.addEventListener('pointerup', e => state.activePointers.delete(e.pointerId));

function calculateProgress() {
  // Rough calculation using a small canvas sample could be done here
  // For performance, we'll increment based on distance moved
  state.fogProgress += 0.001; 
  if (state.fogProgress > 1) state.fogProgress = 1;
  updateProgress();
}

function updateProgress() {
  document.getElementById('progressFill').style.width = (state.fogProgress * 100) + '%';
  if (state.fogProgress >= 1 && !state.isZen) {
    showToast("Phase Complete", 3000);
    setTimeout(nextPhase, 2000);
  }
}

function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

function nextPhase() {
  state.currentPhase = (state.currentPhase + 1) % phases.length;
  state.fogProgress = 0;
  initFog();
  drawStaticBackground();
}

// BUTTONS
document.getElementById('startBtn').onclick = () => {
  state.started = true;
  document.getElementById('mainMenu').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  initAudio();
};

document.getElementById('zenBtn').onclick = () => {
  state.isZen = true;
  document.getElementById('startBtn').click();
};

document.getElementById('pauseBtn').onclick = () => {
  state.paused = true;
  document.getElementById('pauseScreen').classList.remove('hidden');
};

document.getElementById('resumeBtn').onclick = () => {
  state.paused = false;
  document.getElementById('pauseScreen').classList.add('hidden');
};

document.getElementById('mainMenuBtn').onclick = () => {
  location.reload();
};

document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('settingsScreen').classList.remove('hidden');
};

document.getElementById('saveSettings').onclick = () => {
  document.getElementById('settingsScreen').classList.add('hidden');
};

document.getElementById('rainSlider').oninput = (e) => {
  state.rainIntensity = e.target.value / 100;
  document.getElementById('rainVal').textContent = e.target.value + '%';
};

document.getElementById('musicSlider').oninput = (e) => {
  state.musicVolume = e.target.value / 100;
  document.getElementById('musicVal').textContent = e.target.value + '%';
  updateAudioVolumes();
};

// Start Loop
requestAnimationFrame(loop);
initFog();
drawStaticBackground();

</script>
</body>
</html>

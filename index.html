<style>
:root{--primary:#38bdf8;--bg-dark:#030712;--panel-bg:rgba(15,23,42,.78);--panel-border:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg-dark);color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none}
button,input{font-family:inherit}
#game{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

#vignette{position:absolute;inset:0;z-index:9;pointer-events:none;background:radial-gradient(circle at center,transparent 35%,rgba(3,7,18,.78) 100%)}
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));transition:opacity .5s}

.hud-header{display:flex;justify-content:space-between;align-items:center}
.hud-left,.hud-right{display:flex;align-items:center;gap:10px}

.hud-btn:active{transform:scale(.92)}

.phase-badge{background:rgba(15,23,42,.55);border:1px solid var(--panel-border);backdrop-filter:blur(12px);padding:8px 13px;border-radius:18px;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.8)}

@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}
.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,7,18,.7);backdrop-filter:blur(10px);transition:.4s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}

.store-item-title{font-size:13px;font-weight:600;margin-bottom:4px}

.slot-name{font-size:12px;margin-top:5px}

.toggle.on{background:rgba(56,189,248,.45);border-color:rgba(56,189,248,.7)}

</style>
</head>

function renderStore(){ const grid=document.getElementById("storeGrid"); grid.innerHTML=""; Object.keys(brushes).forEach(k=>{ const b=brushes[k], isUnlock=!!unlocked[k]; const div=document.createElement("div"); div.className="store-item "+(state.brush1===k||state.brush2===k?"active":""); div.innerHTML=`<div class="store-preview">${b.radius}px • ${b.blur}</div><div class="store-item-title">${b.name}</div><div class="store-item-desc">${b.desc}</div><div class="store-item-cost">${isUnlock?t('equip'):b.cost+" 🌧️"}</div>`; div.onclick=()=>{ if(!isUnlock){ if(state.points<b.cost) return; state.points-=b.cost; unlocked[k]=true; save(); updateCoins(); renderStore(); return; } if(state.brush1===k) state.brush2=k; else state.brush1=k; save(); renderStore(); updateFingerSlots(); }; grid.appendChild(div); }); updateFingerSlots(); }

function updateSettingsUI(){ document.getElementById("rainSlider").value=Math.round(state.rainIntensity*100); document.getElementById("rainVal").textContent=Math.round(state.rainIntensity*100)+"%"; document.getElementById("rainSoundSlider").value=Math.round(state.rainVolume*100); document.getElementById("rainSoundVal").textContent=Math.round(state.rainVolume*100)+"%"; document.getElementById("ambSlider").value=Math.round(state.ambVolume*100); document.getElementById("ambVal").textContent=Math.round(state.ambVolume*100)+"%"; setToggle("gameSoundToggle",state.gameSound); setToggle("musicToggle",state.musicSound); setToggle("vibrationToggle",state.vibration); buildExtras(); }
function setToggle(id,on){ const e=document.getElementById(id); if(e) e.classList.toggle("on",on); }
const RS_TEXT={ pt:{continue:"CONTINUAR FASE",zen:"MODO ZEN (INFINITO)",phases:"FASES & MEMÓRIAS",store:"LOJA DE DEDOS",settings:"AJUSTES",back:"VOLTAR",save:"SALVAR E VOLTAR",pause:"Pausa",resume:"RETORNAR E RELAXAR",main:"MENU PRINCIPAL",next:"PRÓXIMA FASE",rain:"Intensidade da Chuva",rainSound:"Som da chuva",amb:"Volume da Ambiência",mist:"mist",equip:"EQUIPAR",perfect:"LIMPEZA PERFEITA",infinite:"PAZ INFINITA",clean:"PASSE O DEDO PARA LIMPAR",defog:"Desembace a janela",lang:"Idioma",phasesTitle:"Fases & Memórias",phasesDesc:"Cada chuva guarda um sentimento.",storeTitle:"Loja de Dedos",storeDesc:"10 dedos diferentes. Fino, grosso, nitidez e vinheta.",settingsTitle:"Ajustes",pauseDesc:"A chuva continua esperando por você.",rewardTitle:"Chuva concluída",rewardDesc:"Você terminou esta memória.",adDesc:"Um pequeno momento antes da próxima chuva.",zenAuto:"Regenerar névoa automaticamente",zenAutoDesc:"Deixe a névoa voltar sozinha lentamente.",gameSound:"Som do Jogo",gameDesc:"Gotas e ambiente",musicSound:"Música / atmosfera",musicDesc:"Camada lo-fi da fase",vib:"Vibração",vibDesc:"Feedback ao tocar"}, en:{continue:"CONTINUE PHASE",zen:"ZEN MODE (INFINITE)",phases:"PHASES & MEMORIES",store:"FINGER SHOP",settings:"SETTINGS",back:"BACK",save:"SAVE & BACK",pause:"Paused",resume:"RETURN & RELAX",main:"MAIN MENU",next:"NEXT PHASE",rain:"Rain Intensity",rainSound:"Rain Sound",amb:"Ambience Volume",mist:"mist",equip:"EQUIP",perfect:"PERFECT WIPE",infinite:"INFINITE PEACE",clean:"SWIPE TO WIPE THE FOG",defog:"Defog the window",lang:"Language",phasesTitle:"Phases & Memories",phasesDesc:"Each rain keeps a feeling.",storeTitle:"Finger Shop",storeDesc:"10 different fingers.",settingsTitle:"Settings",pauseDesc:"Rain is still waiting for you.",rewardTitle:"Rain completed",rewardDesc:"You finished this memory.",adDesc:"A short moment before next rain.",zenAuto:"Auto-regenerate fog",zenAutoDesc:"Let the mist return slowly.",gameSound:"Game Sound",gameDesc:"Drops and ambience",musicSound:"Music / atmosphere",musicDesc:"Lo-fi layer",vib:"Vibration",vibDesc:"Haptic feedback"}, es:{continue:"CONTINUAR FASE",zen:"MODO ZEN (INFINITO)",phases:"FASES Y MEMORIAS",store:"TIENDA DE DEDOS",settings:"AJUSTES",back:"VOLVER",save:"GUARDAR Y VOLVER",pause:"Pausa",resume:"VOLVER Y RELAJARSE",main:"MENÚ PRINCIPAL",next:"SIGUIENTE FASE",rain:"Intensidad de lluvia",rainSound:"Sonido de lluvia",amb:"Volumen ambiente",mist:"mist",equip:"EQUIPAR",perfect:"LIMPIEZA PERFECTA",infinite:"PAZ INFINITA",clean:"PASA EL DEDO PARA LIMPIAR",defog:"Desempaña la ventana",lang:"Idioma",phasesTitle:"Fases y Memorias",phasesDesc:"Cada lluvia guarda un sentimiento.",storeTitle:"Tienda de Dedos",storeDesc:"10 dedos diferentes.",settingsTitle:"Ajustes",pauseDesc:"La lluvia sigue esperándote.",rewardTitle:"Lluvia completada",rewardDesc:"Terminaste esta memoria.",adDesc:"Un momento antes de la próxima lluvia.",zenAuto:"Regenerar niebla automáticamente",zenAutoDesc:"Deja que la niebla vuelva sola lentamente.",gameSound:"Sonido del Juego",gameDesc:"Gotas y ambiente",musicSound:"Música / atmósfera",musicDesc:"Capa lo-fi",vib:"Vibración",vibDesc:"Feedback háptico"}};
function t(k){ return (RS_TEXT[state.lang]||RS_TEXT.pt)[k]||k; }
function applyLang(){ const set=(id,k)=>{const e=document.getElementById(id); if(e) e.textContent=t(k);}; set('continueBtn','continue'); set('zenBtn','zen'); set('phasesBtn','phases'); set('storeBtn','store'); set('settingsBtn','settings'); set('closePhasesBtn','back'); set('closeStoreBtn','back'); set('closeSettingsBtn','save'); set('resumeBtn','resume'); set('exitMenuBtn','main'); set('pauseSettingsBtn','settings'); set('nextPhaseBtn','next'); set('rewardMenuBtn','main'); set('rainLabel','rain'); set('rainSoundLabel','rainSound'); set('ambLabel','amb'); set('phasesTitle','phasesTitle'); set('storeTitle','storeTitle'); set('settingsTitle','settingsTitle'); set('pauseTitle','pause'); set('rewardTitle','rewardTitle'); document.getElementById('phasesDesc').textContent=t('phasesDesc'); document.getElementById('storeDesc').textContent=t('storeDesc'); document.getElementById('pauseDesc').textContent=t('pauseDesc'); document.getElementById('rewardDesc').textContent=t('rewardDesc'); document.getElementById('adDesc').textContent=t('adDesc'); document.getElementById('gameSoundTitle').textContent=t('gameSound'); document.getElementById('gameSoundDesc').textContent=t('gameDesc'); document.getElementById('musicTitle').textContent=t('musicSound'); document.getElementById('musicDesc').textContent=t('musicDesc'); document.getElementById('vibTitle').textContent=t('vib'); document.getElementById('vibDesc').textContent=t('vibDesc'); document.getElementById('zenManualHudBtn').textContent=t('mist'); const mb=document.getElementById('rsZenManual'); if(mb) mb.textContent=t('mist'); const instr=document.getElementById('instruction'); if(instr) instr.textContent=state.isZen?t('infinite'):t('clean'); const prog=document.querySelector('.progress-label'); if(prog) prog.textContent=t('defog'); }
let rsSettingsFromPhase=false;
function buildExtras(){ const content=document.getElementById('settingsContent'); if(!content) return; let langRow=document.getElementById('rsLanguageRow'); if(!langRow){ langRow=document.createElement('div'); langRow.id='rsLanguageRow'; langRow.className='setting-row'; langRow.style.marginTop='22px'; langRow.innerHTML='<span id="langLabel"></span><button id="langToggleBtn" class="btn btn-small" style="padding:5px 12px;min-height:32px;border-radius:999px;min-width:92px"></button>'; content.appendChild(langRow); document.getElementById('langToggleBtn').onclick=()=>{ state.lang=state.lang==='pt'?'en':state.lang==='en'?'es':'pt'; save(); applyLang(); updateUI(); renderPhases(); renderStore(); updateSettingsUI(); }; } langRow.style.display=(!rsSettingsFromPhase&&!state.isZen)?'flex':'none'; const b=document.getElementById('langToggleBtn'); if(b) b.textContent=state.lang==='pt'?'Português':state.lang==='en'?'English':'Español'; const ll=document.getElementById('langLabel'); if(ll) ll.textContent=t('lang'); let zenBox=document.getElementById('rsZenSettings'); if(!zenBox){ zenBox=document.createElement('div'); zenBox.id='rsZenSettings'; zenBox.style.marginTop='24px'; zenBox.style.paddingTop='18px'; zenBox.style.borderTop='1px solid rgba(255,255,255,.1)'; zenBox.innerHTML='<h3 style="margin:0 0 12px;font-size:14px;" id="zenTitle">Modo Zen</h3><div class="toggle-row"><div class="toggle-text"><strong id="zenAutoLabel"></strong><span id="zenAutoDesc"></span></div><div id="rsZenAutoToggle" class="toggle"></div></div><button id="rsZenManual" class="btn" style="width:100%;margin-top:14px">mist</button>'; content.appendChild(zenBox); document.getElementById('rsZenAutoToggle').onclick=()=>{ state.zenAutoFog=!state.zenAutoFog; setToggle('rsZenAutoToggle',state.zenAutoFog); updateZenUI(); save(); }; document.getElementById('rsZenManual').onclick=()=>regenFull(); } zenBox.style.display=state.isZen?'block':'none'; setToggle('rsZenAutoToggle',state.zenAutoFog); const za=document.getElementById('zenAutoLabel'); if(za) za.textContent=t('zenAuto'); const zad=document.getElementById('zenAutoDesc'); if(zad) zad.textContent=t('zenAutoDesc'); }
function updateZenUI(){ const btn=document.getElementById('zenManualHudBtn'); const coin=document.querySelector('.currency-badge'); const badge=document.querySelector('.phase-badge'); const show=!!state.isZen &&!state.zenAutoFog; if(btn){ btn.classList.toggle('hidden',!show); btn.textContent=t('mist'); btn.onclick=()=>regenFull(); } if(coin) coin.style.display=state.isZen?'none':''; if(badge) badge.style.display=state.isZen?'none':''; const mb=document.getElementById('rsZenManual'); if(mb){ mb.style.display=state.isZen&&!state.zenAutoFog?'block':'none'; mb.textContent=t('mist'); } }
function regenFull(){ initFog(); state.zenRegenAccum=0; }
function slowZen(dt){ if(!state.isZen||!state.zenAutoFog||state.paused||!state.started) return; state.zenRegenAccum+=dt; if(state.zenRegenAccum<1.2) return; state.zenRegenAccum=0; fogCtx.save(); fogCtx.globalCompositeOperation='source-over'; for(let i=0;i<3;i++){ const idx=Math.floor(Math.random()*fogGrid.length); if(!fogGrid[idx]){ fogGrid[idx]=false; snowGrid[idx]=0; const gx=idx%GRID_X, gy=Math.floor(idx/GRID_X), x=(gx+.5)/GRID_X*W, y=(gy+.5)/GRID_Y*H, r=Math.min(W,H)*(.035+Math.random()*.055); const g=fogCtx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba(210,220,228,.20)'); g.addColorStop(1,'transparent'); fogCtx.fillStyle=g; fogCtx.beginPath(); fogCtx.arc(x,y,r,0,Math.PI*2); fogCtx.fill(); } } fogCtx.restore(); updateProgress(); }
function loop(time){ const dt=Math.min((time-state.lastTime)/1000,.1); state.lastTime=time; if(state.started&&!state.paused){ const ph=phases[state.currentPhase]; let rainCount; if(state.isZen){ rainCount=Math.max(20,Math.min(RS_MAX_RAIN,Math.round(20+state.rainIntensity*RS_MAX_RAIN*0.9))); } else { rainCount=Math.max(30,Math.min(RS_MAX_RAIN,Math.round(30+state.rainIntensity*RS_MAX_RAIN*.95*Math.max(.45,ph.rain)))); } for(let i=0;i<rainParticles.length;i++) rainParticles[i]._inactive=i>=rainCount; rainCtx.clearRect(0,0,W,H); glassCtx.clearRect(0,0,W,H); slowZen(dt); if(state.isZen && state.rainIntensity>=0.95){ for(let i=0;i<zenSnow.length;i++){ const s=zenSnow[i]; s.y+=s.v*dt*state.rainIntensity; s.x+=Math.sin((performance.now()+i*70)*.001)*.2; if(s.y>H+10){ s.y=-10; s.x=Math.random()*W; } rainCtx.fillStyle=`rgba(255,255,255,${.5+Math.random()*.4})`; rainCtx.beginPath(); rainCtx.arc(s.x,s.y,s.r,0,Math.PI*2); rainCtx.fill(); } } if((ph.weather==='car'||ph.type==='car'||ph.type==='car_snow')&&!state.isZen) roadOffset+=dt*(10+state.rainIntensity*12); rainParticles.forEach(p=>{ if(p._inactive) return; p.update(dt); p.draw(); }); glassDrops.forEach(d=>{ d.update(dt); d.draw(); }); if((ph.weather==='car'||ph.type==='car'||ph.type==='car_snow')&&!state.isZen) drawBG(); } requestAnimationFrame(loop); }

document.getElementById("phasesBtn").onclick=()=>{ renderPhases(); document.getElementById("phasesScreen").classList.remove("hidden"); };

document.getElementById("closeStoreBtn").onclick=()=>document.getElementById("storeScreen").classList.add("hidden");
document.getElementById("settingsBtn").onclick=()=>{ rsSettingsFromPhase=false; updateSettingsUI(); document.getElementById("settingsScreen").classList.remove("hidden"); };
document.getElementById("pauseSettingsBtn").onclick=()=>{ rsSettingsFromPhase=true; updateSettingsUI(); document.getElementById("pauseScreen").classList.add("hidden"); document.getElementById("settingsScreen").classList.remove("hidden"); };
document.getElementById("closeSettingsBtn").onclick=()=>{ save(); document.getElementById("settingsScreen").classList.add("hidden"); if(rsSettingsFromPhase&&state.started){ document.getElementById("pauseScreen").classList.remove("hidden"); state.paused=true; } else { updateUI(); } updateAudio(); rsSettingsFromPhase=false; };
document.getElementById("pauseBtn").onclick=()=>{ if(!state.started) return; state.paused=true; document.getElementById("pauseScreen").classList.remove("hidden"); };
document.getElementById("resumeBtn").onclick=()=>{ state.paused=false; document.getElementById("pauseScreen").classList.add("hidden"); initAudio(); };
document.getElementById("exitMenuBtn").onclick=()=>{ showAd(()=>{ state.started=false; state.paused=false; state.activePointers.clear(); state.isZen=false; initFog(); state.hasInteracted=false; document.getElementById("instruction").classList.remove("hidden-text"); document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById("hud").classList.add("hidden"); document.getElementById("mainMenu").classList.remove("hidden"); updateUI(); updateZenUI(); save(); }); };
document.getElementById("nextPhaseBtn").onclick=()=>{ if(state.currentPhase<phases.length-1) startPhase(state.currentPhase+1); else { document.getElementById("rewardScreen").classList.add("hidden"); document.getElementById("mainMenu").classList.remove("hidden"); updateUI(); } };
document.getElementById("rewardMenuBtn").onclick=()=>{ showAd(()=>{ document.getElementById("rewardScreen").classList.add("hidden"); document.getElementById("mainMenu").classList.remove("hidden"); updateUI(); }); };
document.getElementById("rainSlider").oninput=e=>{ state.rainIntensity=Number(e.target.value)/100; document.getElementById("rainVal").textContent=e.target.value+"%"; updateAudio(); save(); };
document.getElementById("rainSoundSlider").oninput=e=>{ state.rainVolume=Number(e.target.value)/100; document.getElementById("rainSoundVal").textContent=e.target.value+"%"; updateAudio(); save(); };
document.getElementById("ambSlider").oninput=e=>{ state.ambVolume=Number(e.target.value)/100; document.getElementById("ambVal").textContent=e.target.value+"%"; updateAudio(); save(); };
document.getElementById("gameSoundToggle").onclick=()=>{ state.gameSound=!state.gameSound; setToggle("gameSoundToggle",state.gameSound); updateAudio(); save(); };
document.getElementById("musicToggle").onclick=()=>{ state.musicSound=!state.musicSound; setToggle("musicToggle",state.musicSound); updateAudio(); save(); };
document.getElementById("vibrationToggle").onclick=()=>{ state.vibration=!state.vibration; setToggle("vibrationToggle",state.vibration); save(); };
load();
state.currentPhase=Math.min(state.currentPhase,state.highestPhase);
updateUI();
updateSettingsUI();
updateFingerSlots();
updateZenUI();
resize();
requestAnimationFrame(loop);

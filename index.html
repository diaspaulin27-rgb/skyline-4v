<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>Rainy Skyline — V4.5</title>
<style>
:root{--primary:#38bdf8;--bg-dark:#030712;--panel-bg:rgba(15,23,42,.78);--panel-border:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030712;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;touch-action:none}
#game{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgCanvas{z-index:1}#rainCanvas{z-index:3}#glassCanvas{z-index:5}#fogCanvas{z-index:7}
#hud{position:absolute;inset:0;z-index:20;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:20px}
#hud.hidden{opacity:0;pointer-events:none}
.hud-header{display:flex;justify-content:space-between}
.hud-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--panel-border);background:rgba(15,23,42,.62);color:white;display:grid;place-items:center;pointer-events:auto;cursor:pointer}
.currency-badge{background:rgba(15,23,42,.62);border:1px solid var(--panel-border);padding:8px 16px;border-radius:20px;color:var(--primary);pointer-events:auto;display:flex;gap:8px;align-items:center}
.phase-badge{background:rgba(15,23,42,.55);border:1px solid var(--panel-border);padding:8px 13px;border-radius:18px;font-size:11px}
#instruction{text-align:center;font-size:11px;letter-spacing:4px;text-transform:uppercase;animation:pulse 2s infinite}
.progress-wrap{width:min(380px,70vw);margin:0 auto 18px;text-align:center}
.progress-bar{width:100%;height:4px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#38bdf8,#fff);transition:width.2s}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}
.screen{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,7,18,.7);backdrop-filter:blur(10px);transition:.4s}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none}
.menu-card{width:min(450px,100%);max-height:calc(100vh - 40px);overflow-y:auto;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:28px;padding:32px 24px;text-align:center}
.btn{min-height:52px;border-radius:16px;border:1px solid var(--panel-border);background:rgba(255,255,255,.05);color:white;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:10px 16px;width:100%;margin-bottom:12px}
.btn-primary{background:linear-gradient(135deg,#0284c7,#0369a1)}
.btn-small{min-height:38px;font-size:11px;padding:6px 14px;border-radius:12px;width:auto}
.phase-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;max-height:330px;overflow-y:auto}
.phase-item{border:1px solid var(--panel-border);border-radius:16px;padding:14px;background:rgba(255,255,255,.035);text-align:left;cursor:pointer}
.phase-item.active{border-color:var(--primary);background:rgba(56,189,248,.1)}.phase-item.locked{opacity:.35}
.store-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;max-height:380px;overflow-y:auto}
.store-item{border:1px solid var(--panel-border);border-radius:16px;padding:13px;background:rgba(255,255,255,.03);cursor:pointer;text-align:left}.store-item.active{border-color:var(--primary);background:rgba(56,189,248,.1)}
.setting-row{display:flex;justify-content:space-between;margin-bottom:9px;font-size:13px}.toggle-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
.toggle{width:48px;height:27px;border-radius:30px;background:rgba(255,255,255,.12);position:relative;cursor:pointer}.toggle::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:white;transition:.2s}.toggle.on{background:rgba(56,189,248,.45)}.toggle.on::after{transform:translateX(21px)}
input[type="range"]{width:100%;height:6px;appearance:none;border-radius:10px;background:rgba(255,255,255,.1);outline:none;margin-top:8px}input[type="range"]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer}
#rsToast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);z-index:9999;padding:10px 16px;border-radius:999px;background:rgba(8,15,30,.82);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;opacity:0;transition:.25s;pointer-events:none}
</style>
</head>
<body>
<div id="game">
<canvas id="bgCanvas"></canvas><canvas id="rainCanvas"></canvas><canvas id="glassCanvas"></canvas><canvas id="fogCanvas"></canvas>
<div id="hud" class="hidden">
<div class="hud-header"><div style="display:flex;gap:10px;align-items:center"><button id="pauseBtn" class="hud-btn">Ⅱ</button><div class="phase-badge">FASE <span id="phaseDisplay">1</span>/20</div></div><div style="display:flex;gap:10px;align-items:center"><div class="currency-badge">🌧️ <span id="pointsDisplay">0</span></div><button id="zenManualHudBtn" class="btn btn-small hidden" style="pointer-events:auto;">mist</button></div></div>
<div><div id="instruction">PASSE O DEDO PARA LIMPAR</div><div class="progress-wrap"><div style="font-size:9px;letter-spacing:2px;margin-bottom:7px;opacity:.6">Desembace a janela</div><div class="progress-bar"><div id="progressFill"></div></div></div></div>
</div>
<section id="mainMenu" class="screen"><div class="menu-card"><h1 style="font-family:Georgia;font-size:38px;margin:0">Rainy Skyline</h1><p style="font-size:11px;letter-spacing:3px;opacity:.5;margin:8px 0 32px">Atmospheric Relaxation</p><div id="mainPhaseInfo"><h2 id="menuPhaseName" style="margin:0;font-family:Georgia;font-size:27px"></h2><div id="menuPhaseFeeling" style="margin:7px 0 4px;color:#38bdf8;font-size:11px;letter-spacing:2px;text-transform:uppercase"></div><p id="menuPhaseStory" style="font-size:12px;opacity:.55;margin:0 0 22px;line-height:1.5"></p></div><button id="continueBtn" class="btn btn-primary"></button><button id="zenBtn" class="btn"></button><button id="phasesBtn" class="btn"></button><button id="storeBtn" class="btn"></button><button id="settingsBtn" class="btn"></button></div></section>
<section id="phasesScreen" class="screen hidden"><div class="menu-card"><h2 id="phasesTitle" style="margin:0"></h2><p id="phasesDesc" style="font-size:12px;opacity:.5;margin-top:6px"></p><div id="phaseList" class="phase-list"></div><button id="closePhasesBtn" class="btn"></button></div></section>
<section id="storeScreen" class="screen hidden"><div class="menu-card"><h2 id="storeTitle" style="margin:0"></h2><p id="storeDesc" style="font-size:12px;opacity:.5;margin-top:4px"></p><div style="color:#38bdf8;margin:10px 0">🌧️ <span id="storeCoins">0</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0"><div style="border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px"><div style="font-size:9px;opacity:.4">Dedo 1</div><div id="slot1Name" style="font-size:12px;margin-top:5px"></div></div><div style="border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px"><div style="font-size:9px;opacity:.4">Dedo 2</div><div id="slot2Name" style="font-size:12px;margin-top:5px"></div></div></div><div id="storeGrid" class="store-grid"></div><button id="closeStoreBtn" class="btn"></button></div></section>
<section id="settingsScreen" class="screen hidden"><div class="menu-card"><h2 id="settingsTitle" style="margin:0 0 20px"></h2><div style="text-align:left" id="settingsContent"><div class="setting-row"><span id="rainLabel"></span><span id="rainVal">70%</span></div><input id="rainSlider" type="range" min="10" max="100" value="70"><div class="setting-row" style="margin-top:22px"><span id="rainSoundLabel"></span><span id="rainSoundVal">70%</span></div><input id="rainSoundSlider" type="range" min="0" max="100" value="70"><div class="setting-row" style="margin-top:22px"><span id="ambLabel"></span><span id="ambVal">50%</span></div><input id="ambSlider" type="range" min="0" max="100" value="50"><div style="margin-top:25px"><div class="toggle-row"><div><strong id="gameSoundTitle"></strong><span id="gameSoundDesc" style="font-size:10px;opacity:.4"></span></div><div id="gameSoundToggle" class="toggle on"></div></div><div class="toggle-row"><div><strong id="musicTitle"></strong><span id="musicDesc" style="font-size:10px;opacity:.4"></span></div><div id="musicToggle" class="toggle on"></div></div><div class="toggle-row"><div><strong id="vibTitle"></strong><span id="vibDesc" style="font-size:10px;opacity:.4"></span></div><div id="vibrationToggle" class="toggle on"></div></div></div></div><button id="closeSettingsBtn" class="btn" style="width:100%;margin-top:25px"></button></div></section>
<section id="pauseScreen" class="screen hidden"><div class="menu-card"><h2 id="pauseTitle" style="margin:0 0 8px"></h2><p id="pauseDesc" style="font-size:11px;opacity:.45;margin-bottom:25px"></p><button id="resumeBtn" class="btn btn-primary"></button><button id="pauseSettingsBtn" class="btn"></button><button id="exitMenuBtn" class="btn"></button></div></section>
<section id="adScreen" class="screen hidden"><div class="menu-card"><div style="letter-spacing:3px;font-size:10px;opacity:.5" id="adLabel">INTERVALO</div><div style="margin:15px 0;font-size:24px">•••</div><p style="font-size:12px;opacity:.6" id="adDesc"></p></div></section>
<section id="rewardScreen" class="screen hidden"><div class="menu-card"><div style="font-size:48px">✦</div><h2 id="rewardTitle" style="font-family:Georgia;font-size:30px;margin:0"></h2><div id="rewardPhaseName" style="color:#38bdf8;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:7px"></div><div style="font-size:28px;color:#38bdf8;margin:15px 0;font-weight:700">+100 🌧️</div><p id="rewardDesc" style="font-size:12px;opacity:.55;margin-bottom:24px"></p><button id="nextPhaseBtn" class="btn btn-primary"></button><button id="rewardMenuBtn" class="btn"></button></div></section>
</div>
<div id="rsToast"></div>
<script>
/* Rainy Skyline V4.5 — targeted update */
const PHASE_COMPLETE=0.99;
const state={started:false,paused:false,currentPhase:0,highestPhase:0,points:0,hasInteracted:false,rainIntensity:0.7,ambVolume:0.5,rainVolume:0.7,gameSound:true,musicSound:true,vibration:true,lastTime:performance.now(),fogProgress:0,brush1:"soft",brush2:"soft",activePointers:new Map(),lang:"pt",isZen:false,zenAutoFog:false,zenRegenAccum:0};
const PHASE_TEXT=[
["The First Rain","La Primera Lluvia","A Primeira Chuva","Serenity","Serenidad","Serenidade","A silent city receives the first rain.","Una ciudad silenciosa recibe la primera lluvia.","Uma cidade silenciosa recebe a primeira chuva."],
["Distant Lights","Luces Distantes","Luzes Distantes","Nostalgia","Nostalgia","Nostalgia","Windows stay awake across the avenue.","Ventanas siguen despiertas.","Janelas permanecem acesas."],
["After Midnight","Despues de Medianoche","Depois da Meia-Noite","Solitude","Soledad","Solidão","Only traffic lights remain awake.","Solo los semáforos siguen despiertos.","Só os semáforos continuam acordados."],
["Neon","Neon","Neon","Contemplation","Contemplacion","Contemplação","Streets become liquid reflections.","Calles se convierten en reflejos líquidos.","Ruas parecem reflexos líquidos."],
["The Window","La Ventana","A Janela","Intimacy","Intimidad","Intimidade","Protected behind the glass.","Protegido detrás del cristal.","Protegido atrás do vidro."],
["Storm","Tormenta","Tempestade","Tension","Tension","Tensão","Wind rises and city disappears.","El viento aumenta y la ciudad desaparece.","O vento aumenta e a cidade desaparece."],
["Horizon","Horizonte","Horizonte","Hope","Esperanza","Esperança","Small band of light between clouds.","Pequeña franja de luz entre nubes.","Pequena faixa de luz entre nuvens."],
["Memories","Memorias","Memórias","Longing","Añoranza","Saudade","Every drop carries a memory.","Cada gota lleva un recuerdo.","Cada gota carrega uma lembrança."],
["Silence","Silencio","Silêncio","Peace","Paz","Paz","No cars, only water.","Sin coches, solo agua.","Sem carros, só água."],
["Clearing Sky","Cielo Aclarando","O Céu Clareia","Rebirth","Renacimiento","Renascimento","Storm moves away.","Tormenta se aleja.","Tempestade se afasta."],
["Moving Car","Coche en Movimiento","Carro em Movimento","Journey","Viaje","Jornada","City lights glide at 50 km/h.","Luces pasan suavemente.","Luzes deslizando devagar."],
["Snowfall","Nevada","Nevasca","Cold","Frío","Frio","Soft white silence outside.","Suave silencio blanco fuera.","Silêncio branco e suave lá fora."],
["Highway Rain","Lluvia en Autopista","Chuva na Rodovia","Speed","Velocidad","Velocidade","Wet highway at 60 km/h.","Autopista mojada a 60 km/h.","Rodovia molhada a 60 km/h."],
["Morning Frost","Escarcha Matinal","Geada Matinal","Crisp","Cristalino","Cristalino","Ice melts slowly.","Hielo se derrite lentamente.","Gelo derrete lentamente."],
["Summer Shower","Lluvia de Verano","Chuva de Verão","Warmth","Calor","Calor","Sunlight through gentle shower.","Luz cálida atraviesa lluvia suave.","Luz quente atravessa chuva suave."],
["Midnight Blizzard","Ventisca Medianoche","Nevasca à Meia-Noite","Isolation","Aislamiento","Isolamento","Snow erases city at midnight.","Nieve borra la ciudad a medianoche.","Neve apaga a cidade à meia-noite."],
["City Tunnel","Túnel Ciudad","Túnel da Cidade","Echo","Eco","Eco","Orange lights in wet tunnel.","Luces naranjas en túnel mojado.","Luzes laranjas em túnel molhado."],
["Golden Drops","Gotas Doradas","Gotas Douradas","Beauty","Belleza","Beleza","Sunset colors through rain.","Colores atardecer brillan entre lluvia.","Cores pôr do sol brilham na chuva."],
["Snowy Drive","Viaje Nevado","Passeio na Neve","Cozy","Acogedor","Aconchego","Warm inside, frozen outside.","Calor dentro, frío fuera.","Quente dentro, frio fora."],
["The Last Wipe","La Última Limpieza","A Última Limpeza","Closure","Despedida","Despedida","Glass finally clear.","Cristal finalmente limpio.","Vidro finalmente limpo."]
];
function getPhaseText(i){const p=PHASE_TEXT[i]||PHASE_TEXT[0];if(state.lang==='en')return{name:p[0],feeling:p[3],story:p[6]};if(state.lang==='es')return{name:p[1],feeling:p[4],story:p[7]};return{name:p[2],feeling:p[5],story:p[8]};}
const phases=PHASE_TEXT.map((_,i)=>({hue:200+i*7,sky:i<10?["#030712","#0f2740"]:i<13?["#0a0a0a","#1a1a1a"]:["#2d3748","#4a5568"],lights:["#38bdf8","#fde68a"],rain:0.6+(i%5)*0.08,thunder:i%6,weather:(i===10||i===12||i===16)?"car":(i===11||i===13||i===15||i===18)?"snow":"rain",type:(i===10||i===12||i===16)?"car":i===18?"car_snow":(i===11||i===13||i===15)?"snow":"rain",landmark:i===0?"cristo":i===3?"eiffel":i===6?"liberty":i===9?"pao":"",music:170+i*6}));
const brushes={soft:{name:"Suave",cost:0,radius:38,blur:0.9,desc:"Grande e suave"},precise:{name:"Preciso",cost:100,radius:22,blur:0.35,desc:"Fino"},broad:{name:"Largo",cost:200,radius:65,blur:0.8,desc:"Área grande"},sharp:{name:"Nítido",cost:300,radius:17,blur:0.12,desc:"Bordas definidas"},feather:{name:"Pluma",cost:350,radius:16,blur:0.18,desc:"Nitidez alta"},cirurgico:{name:"Cirúrgico",cost:500,radius:12,blur:0.1,desc:"Extremamente fino"},nevoa:{name:"Névoa",cost:650,radius:30,blur:1.35,desc:"Difuso"},veludo:{name:"Veludo",cost:800,radius:46,blur:1.05,desc:"Vinheta suave"},cristal:{name:"Cristal",cost:1000,radius:19,blur:0.06,desc:"Muito nítido"},largo:{name:"Chuva Larga",cost:1250,radius:82,blur:0.72,desc:"Gigante"},aura:{name:"Aura",cost:1500,radius:58,blur:1.5,desc:"Halo etéreo"},agulha:{name:"Agulha",cost:1800,radius:9,blur:0.02,desc:"Mais fino"}};
let unlocked={soft:true};
function save(){localStorage.setItem("rainySkylineSave",JSON.stringify({points:state.points,cur:state.currentPhase,high:state.highestPhase,b1:state.brush1,b2:state.brush2,unlocked,rainI:state.rainIntensity,amb:state.ambVolume,rainV:state.rainVolume,gs:state.gameSound,ms:state.musicSound,vib:state.vibration,lang:state.lang,zenAuto:state.zenAutoFog}))}
function load(){try{const d=JSON.parse(localStorage.getItem("rainySkylineSave"));if(!d)return;state.points=d.points||0;state.currentPhase=Math.max(0,Math.min(19,d.cur||0));state.highestPhase=Math.max(0,Math.min(19,d.high||0));state.currentPhase=Math.min(state.currentPhase,state.highestPhase);state.brush1=d.b1||"soft";state.brush2=d.b2||"soft";unlocked=Object.assign({soft:true},d.unlocked||{});state.rainIntensity=d.rainI??0.7;state.ambVolume=d.amb??0.5;state.rainVolume=d.rainV??0.7;state.gameSound=d.gs!==false;state.musicSound=d.ms!==false;state.vibration=d.vib!==false;state.lang=['pt','en','es'].includes(d.lang)?d.lang:'pt';state.zenAutoFog=!!d.zenAuto;}catch(e){}}
const bgC=document.getElementById("bgCanvas"),rainC=document.getElementById("rainCanvas"),glassC=document.getElementById("glassCanvas"),fogC=document.getElementById("fogCanvas");
const bg=bgC.getContext("2d"),rainCtx=rainC.getContext("2d"),glassCtx=glassC.getContext("2d"),fogCtx=fogC.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;
function setup(c,ctx){c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
function resize(){const s=state.currentPhase;W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);setup(bgC,bg);setup(rainC,rainCtx);setup(glassC,glassCtx);setup(fogC,fogCtx);initFog();drawBG();state.currentPhase=s;updateUI();}
addEventListener("resize",resize);
let buildings=[],bokeh=[],roadOffset=0,zenSnow=[];
function genCity(){buildings=[];bokeh=[];const ph=phases[state.currentPhase];let x=-40;while(x<W+100){const w=45+Math.random()*80,h=100+Math.random()*H*.5;buildings.push({x,w,h,d:.25+Math.random()*.75});x+=w+4;}for(let i=0;i<35;i++)bokeh.push({x:Math.random()*W,y:H*.25+Math.random()*H*.55,r:8+Math.random()*35,color:ph.lights[Math.floor(Math.random()*ph.lights.length)],alpha:.04+Math.random()*.12});if(zenSnow.length===0)zenSnow=Array.from({length:140},()=>({x:Math.random()*W,y:Math.random()*H,v:20+Math.random()*60,r:.6+Math.random()*2.2}));}
function drawBG(){const ph=phases[state.currentPhase];if(state.isZen){const g=bg.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07111d');g.addColorStop(.42,'#1a3a52');g.addColorStop(1,'#040a10');bg.fillStyle=g;bg.fillRect(0,0,W,H);const moon=bg.createRadialGradient(W*.72,H*.18,0,W*.72,H*.18,150);moon.addColorStop(0,'rgba(235,245,255,.35)');moon.addColorStop(1,'transparent');bg.fillStyle=moon;bg.beginPath();bg.arc(W*.72,H*.18,150,0,Math.PI*2);bg.fill();bg.fillStyle='rgba(8,18,28,.85)';bg.beginPath();bg.moveTo(0,H*.62);bg.lineTo(W*.4,H*.38);bg.lineTo(W*.6,H*.55);bg.lineTo(W,H*.52);bg.lineTo(W,H);bg.lineTo(0,H);bg.closePath();bg.fill();const lake=bg.createLinearGradient(0,H*.68,0,H);lake.addColorStop(0,'rgba(70,130,155,.22)');lake.addColorStop(1,'rgba(2,8,14,.85)');bg.fillStyle=lake;bg.fillRect(0,H*.68,W,H*.32);for(let i=0;i<22;i++){const x=(i*83)%W,y=H*.71+i*8;bg.strokeStyle='rgba(180,220,235,.04)';bg.beginPath();bg.moveTo(x,y);bg.lineTo(x+60,y);bg.stroke();}const cx=W*.24,cy=H*.68;bg.fillStyle='#0e1b24';bg.fillRect(cx-42,cy-50,84,50);bg.beginPath();bg.moveTo(cx-52,cy-50);bg.lineTo(cx,cy-86);bg.lineTo(cx+52,cy-50);bg.closePath();bg.fill();bg.fillStyle='rgba(255,210,110,.88)';bg.fillRect(cx-26,cy-36,14,16);bg.fillRect(cx+12,cy-36,14,16);drawGrass();return;}if(!buildings.length)genCity();const sky=bg.createLinearGradient(0,0,0,H);sky.addColorStop(0,ph.sky[0]);sky.addColorStop(.55,ph.sky[1]);sky.addColorStop(1,"#020308");bg.fillStyle=sky;bg.fillRect(0,0,W,H);bg.save();for(let i=0;i<7;i++){const x=((i*137)+(state.currentPhase*53))%(W+180)-90,y=H*(.08+(i%4)*.07),r=40+(i%3)*28;const g=bg.createRadialGradient(x,y,0,x,y,r*2.3);g.addColorStop(0,'rgba(255,255,255,.05)');g.addColorStop(1,'transparent');bg.fillStyle=g;bg.beginPath();bg.arc(x,y,r*2,0,Math.PI*2);bg.fill();}bg.restore();bokeh.forEach(l=>{const g=bg.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);g.addColorStop(0,l.color);g.addColorStop(1,'transparent');bg.fillStyle=g;bg.globalAlpha=l.alpha;bg.beginPath();bg.arc(l.x,l. function drawGrass(){const y=H*.79;bg.save();bg.globalAlpha=.55;for(let i=0;i<Math.ceil(W/7);i++){const x=i*7+(i%3),h=3+(i*17%9);bg.strokeStyle=`rgba(95,145,92,${.15+(i%5)*.035})`;bg.lineWidth=1;bg.beginPath();bg.moveTo(x,y);bg.lineTo(x-2+(i%4),y-h);bg.stroke();}bg.restore();}

function buildExtras(){const content=document.getElementById('settingsContent');if(!content)return;let langRow=document.getElementById('rsLanguageRow');if(!langRow){langRow=document.createElement('div');langRow.id='rsLanguageRow';langRow.className='setting-row';langRow.style.marginTop='22px';langRow.innerHTML='<span id="langLabel"></span><button id="langToggleBtn" class="btn btn-small" style="padding:5px 12px;min-height:32px"></button>';content.appendChild(langRow);document.getElementById('langToggleBtn').onclick=()=>{state.lang=state.lang==='pt'?'en':state.lang==='en'?'es':'pt';save();applyLang();updateUI();renderPhases();renderStore();updateSettingsUI();};}langRow.style.display=(!rsSettingsFromPhase&&!state.isZen)?'flex':'none';const b=document.getElementById('langToggleBtn');if(b)b.textContent=state.lang==='pt'?'Português':state.lang==='en'?'English':'Español';const ll=document.getElementById('langLabel');if(ll)ll.textContent=t('lang');let zenBox=document.getElementById('rsZenSettings');if(!zenBox){zenBox=document.createElement('div');zenBox.id='rsZenSettings';zenBox.style.marginTop='24px';zenBox.style.paddingTop='18px';zenBox.style.borderTop='1px solid rgba(255,255,255,.1)';zenBox.innerHTML='<h3 style="margin:0 0 12px;font-size:14px" id="zenTitle">Modo Zen</h3><div class="toggle-row"><div><strong id="zenAutoLabel"></strong><span id="zenAutoDesc" style="font-size:10px;opacity:.4"></span></div><div id="rsZenAutoToggle" class="toggle"></div></div><button id="rsZenManual" class="btn" style="width:100%;margin-top:14px">mist</button>';content.appendChild(zenBox);document.getElementById('rsZenAutoToggle').onclick=()=>{state.zenAutoFog=!state.zenAutoFog;setToggle('rsZenAutoToggle',state.zenAutoFog);updateZenUI();save();};document.getElementById('rsZenManual').onclick=()=>regenFull();}zenBox.style.display=state.isZen?'block':'none';setToggle('rsZenAutoToggle',state.zenAutoFog);const manual=document.getElementById('rsZenManual');if(manual){manual.style.display=state.isZen&&!state.zenAutoFog?'block':'none';manual.textContent='mist';}const za=document.getElementById('zenAutoLabel');if(za)za.textContent=t('zenAuto');const zad=document.getElementById('zenAutoDesc');if(zad)zad.textContent=t('zenAutoDesc');}
function updateZenUI(){const btn=document.getElementById('zenManualHudBtn');const coin=document.querySelector('.currency-badge');const badge=document.querySelector('.phase-badge');const show=!!state.isZen&&!state.zenAutoFog;if(btn){btn.classList.toggle('hidden',!show);btn.textContent='mist';btn.onclick=()=>regenFull();}if(coin)coin.style.display=state.isZen?'none':'';if(badge)badge.style.display=state.isZen?'none':'';}
function regenFull(){initFog();state.zenRegenAccum=0;}
function slowZen(dt){if(!state.isZen||!state.zenAutoFog||state.paused||!state.started)return;state.zenRegenAccum+=dt;if(state.zenRegenAccum<1.6)return;state.zenRegenAccum=0;const cx=Math.floor(Math.random()*GRID_X),cy=Math.floor(Math.random()*GRID_Y),spread=2;fogCtx.save();fogCtx.globalCompositeOperation='source-over';for(let yy=cy-spread;yy<=cy+spread;yy++){for(let xx=cx-spread;xx<=cx+spread;xx++){if(xx<0||yy<0||xx>=GRID_X||yy>=GRID_Y)continue;const d=Math.hypot(xx-cx,yy-cy);if(d>spread+.35)continue;const idx=yy*GRID_X+xx;if(!fogGrid[idx]){fogGrid[idx]=false;snowGrid[idx]=0;const x=(xx+.5)/GRID_X*W,y=(yy+.5)/GRID_Y*H,r=Math.min(W,H)*(.045+.02*(1-d/(spread+.35)));const g=fogCtx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(210,220,228,.16)');g.addColorStop(.55,'rgba(205,215,224,.10)');g.addColorStop(1,'transparent');fogCtx.fillStyle=g;fogCtx.beginPath();fogCtx.arc(x,y,r,0,Math.PI*2);fogCtx.fill();}}}fogCtx.restore();updateProgress();}function loop(time){const dt=Math.min((time-state.lastTime)/1000,.1);state.lastTime=time;if(state.started&&!state.paused){const ph=phases[state.currentPhase];let rainCount;if(state.isZen){rainCount=Math.max(20,Math.min(RS_MAX_RAIN,Math.round(20+state.rainIntensity*RS_MAX_RAIN*0.9)));}else{rainCount=Math.max(30,Math.min(RS_MAX_RAIN,Math.round(30+state.rainIntensity*RS_MAX_RAIN*.95*Math.max(.45,ph.rain))));}for(let i=0;i<rainParticles.length;i++)rainParticles[i]._inactive=i>=rainCount;rainCtx.clearRect(0,0,W,H);glassCtx.clearRect(0,0,W,H);slowZen(dt);if(state.isZen&&state.rainIntensity>=0.95){for(let i=0;i<zenSnow.length;i++){const s=zenSnow[i];s.y+=s.v*dt*state.rainIntensity;s.x+=Math.sin((performance.now()+i*70)*.001)*.2;if(s.y>H+10){s.y=-10;s.x=Math.random()*W;}rainCtx.fillStyle='rgba(255,255,255,.6)';rainCtx.beginPath();rainCtx.arc(s.x,s.y,s.r,0,Math.PI*2);rainCtx.fill();}}if((ph.weather==='car'||ph.type==='car'||ph.type==='car_snow')&&!state.isZen)roadOffset+=dt*(28+state.rainIntensity*34);rainParticles.forEach(p=>{if(p._inactive)return;p.update(dt);p.draw();});glassDrops.forEach(d=>{d.update(dt);d.draw();});if((ph.weather==='car'||ph.type==='car')&&!state.isZen)drawBG();}requestAnimationFrame(loop);}
document.getElementById("continueBtn").onclick=()=>startPhase(state.currentPhase);
document.getElementById("zenBtn").onclick=()=>startZen();
document.getElementById("phasesBtn").onclick=()=>{renderPhases();document.getElementById("phasesScreen").classList.remove("hidden");};
document.getElementById("closePhasesBtn").onclick=()=>document.getElementById("phasesScreen").classList.add("hidden");
document.getElementById("storeBtn").onclick=()=>{renderStore();document.getElementById("storeScreen").classList.remove("hidden");};
document.getElementById("closeStoreBtn").onclick=()=>document.getElementById("storeScreen").classList.add("hidden");
document.getElementById("settingsBtn").onclick=()=>{rsSettingsFromPhase=false;updateSettingsUI();document.getElementById("settingsScreen").classList.remove("hidden");};
document.getElementById("pauseSettingsBtn").onclick=()=>{rsSettingsFromPhase=true;updateSettingsUI();document.getElementById("pauseScreen").classList.add("hidden");document.getElementById("settingsScreen").classList.remove("hidden");};
document.getElementById("closeSettingsBtn").onclick=()=>{save();document.getElementById("settingsScreen").classList.add("hidden");if(rsSettingsFromPhase&&state.started){document.getElementById("pauseScreen").classList.remove("hidden");state.paused=true;}else{updateUI();}updateAudio();rsSettingsFromPhase=false;};
document.getElementById("pauseBtn").onclick=()=>{if(!state.started)return;state.paused=true;document.getElementById("pauseScreen").classList.remove("hidden");};
document.getElementById("resumeBtn").onclick=()=>{state.paused=false;document.getElementById("pauseScreen").classList.add("hidden");initAudio();};
document.getElementById("exitMenuBtn").onclick=()=>{showAd(()=>{state.started=false;state.paused=false;state.activePointers.clear();state.isZen=false;initFog();state.hasInteracted=false;document.getElementById("instruction").classList.remove("hidden-text");document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));document.getElementById("hud").classList.add("hidden");document.getElementById("mainMenu").classList.remove("hidden");updateUI();updateZenUI();save();});};
document.getElementById("nextPhaseBtn").onclick=()=>{if(state.currentPhase<phases.length-1)startPhase(state.currentPhase+1);else{document.getElementById("rewardScreen").classList.add("hidden");document.getElementById("mainMenu").classList.remove("hidden");updateUI();}};
document.getElementById("rewardMenuBtn").onclick=()=>{showAd(()=>{document.getElementById("rewardScreen").classList.add("hidden");document.getElementById("mainMenu").classList.remove("hidden");updateUI();});};
document.getElementById("rainSlider").oninput=e=>{state.rainIntensity=Number(e.target.value)/100;document.getElementById("rainVal").textContent=e.target.value+"%";updateAudio();save();};
document.getElementById("rainSoundSlider").oninput=e=>{state.rainVolume=Number(e.target.value)/100;document.getElementById("rainSoundVal").textContent=e.target.value+"%";updateAudio();save();};
document.getElementById("ambSlider").oninput=e=>{state.ambVolume=Number(e.target.value)/100;document.getElementById("ambVal").textContent=e.target.value+"%";updateAudio();save();};
document.getElementById("gameSoundToggle").onclick=()=>{state.gameSound=!state.gameSound;setToggle("gameSoundToggle",state.gameSound);updateAudio();save();};
document.getElementById("musicToggle").onclick=()=>{state.musicSound=!state.musicSound;setToggle("musicToggle",state.musicSound);updateAudio();save();};
document.getElementById("vibrationToggle").onclick=()=>{state.vibration=!state.vibration;setToggle("vibrationToggle",state.vibration);save();};
load();
state.currentPhase=Math.min(state.currentPhase,state.highestPhase);
updateUI();
updateSettingsUI();
updateFingerSlots();
updateZenUI();
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
